# Baut, testet und paketiert DataClean, sobald ein Versions-Tag gepusht wird, und veröffentlicht
# dazu ein GitHub-Release mit Installer, einzelner Exe und ZIP. Das Tag bestimmt die Version:
# v2.0.0 ergibt 2.0.0. Schlägt ein Schritt fehl, entsteht kein Release.
#
# Der manuelle Start ist ein Probelauf: Er baut dasselbe, legt die Dateien aber nur als
# Build-Artefakt ab und ändert kein Release.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Versionsnummer für den Probelauf
        required: true
        default: 2.0.0

permissions:
  contents: write

jobs:
  package:
    # Enthält Visual Studio mit dem .NET Framework 4.8 Targeting Pack und Inno Setup.
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Version bestimmen
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG -replace '^v', '' } else { $env:INPUT_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Ungültige Version '$version'. Erwartet wird ein Tag wie v2.0.0."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Bauen, testen und paketieren
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./packaging/build-package.ps1 -Version $env:VERSION -RunTests -Installer

      - name: Release veröffentlichen
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # gh meldet ein fehlendes Release über den Exitcode; das darf hier nicht abbrechen.
          $PSNativeCommandUseErrorActionPreference = $false
          $files = "artifacts/DataClean-Setup-$env:VERSION.exe", "artifacts/DataClean.exe", "artifacts/DataClean-$env:VERSION.zip"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
              # Ein auf GitHub zusammen mit dem Tag angelegtes Release behält seinen Text.
              gh release upload $env:RELEASE_TAG $files --clobber
          } else {
              gh release create $env:RELEASE_TAG $files --verify-tag --generate-notes --title "DataClean $env:VERSION"
          }

      - name: Als Build-Artefakt ablegen
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: DataClean-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error
